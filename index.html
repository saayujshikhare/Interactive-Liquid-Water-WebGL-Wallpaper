            const radius = (0.0014 + 0.0026 * hash11(sseed + 3.0)) * (0.80 + 0.30 * pulse);
            gl.uniform4f(uBubbleLocs[b], bx, surf - depthB, radius, 0.45 + 0.45 * pulse);
            continue;
          }

          const seed = fb * 37.13 + 2.7;
          const cycle = 6.5 + 6.0 * hash11(seed + 1.9);
          const phase = hash11(seed + 4.2);
          const life = fract(t / cycle + phase);
          if (life < 0.02 || life > 0.985) {
            gl.uniform4f(uBubbleLocs[b], 0.0, 0.0, 0.0, 0.0);
            continue;
          }

          let colX = (hash11(seed + 6.1) * 2.0 - 1.0) * halfW * 0.92;
          const startY = 0.015 + 0.26 * hash11(seed + 8.3);
          let riseY = startY + (0.470 - startY) * sstep(0.0, 1.0, life);

          // Slow lazy wobble as they decompress on the way up
          colX += Math.sin(t * 1.1 + fb * 2.7) * 0.006 + Math.sin(t * 2.3 + fb * 5.1) * 0.0025;
          let yB = riseY + Math.sin(t * 3.0 + fb * 1.3) * 0.0025;

          // The swell carries the bubbles; the cursor bends them aside with a viscous
          // swirl that relaxes as the pointer's energy fades (no bouncing).
          const surf = estimateWaterSurfaceY(colX, t) - 0.496;
          colX += surf * 0.060;
          yB += surf * 0.035;
          if (waterE > 0.001) {
            const dx = colX - mouse.x;
            const dy = yB - mouse.y;
            const near = Math.exp(-(dx * dx + dy * dy) * 42.0) * waterE;
            if (near > 0.001) {
              colX += (dx >= 0.0 ? 1.0 : -1.0) * near * 0.014 + mouse.velX * near * 0.010;
              yB += (dy >= 0.0 ? 1.0 : -1.0) * near * 0.010 + mouse.velY * near * 0.010;
            }
          }

          // Audio: the column breathes with the music; bubbles swell slightly and brighten
          // Bias toward many tiny glass beads with a few larger ones, like real aerated water
          const radius =
            (0.0013 + 0.0047 * Math.pow(hash11(seed + 3.3), 1.7)) * (1.0 + audio.bass * 0.12);
          const fade = Math.min(
            1.0,
            sstep(0.02, 0.10, life) * (1.0 - sstep(0.80, 0.985, life)) * (1.0 + audio.level * 0.22)
          );

          gl.uniform4f(uBubbleLocs[b], colX, yB, radius, fade);
        }
      }

      // Fish school: persistent CPU motion (waves, cursor gusts, overdamped lanes)
      // then one vec4 pair per fish per frame — no per-pixel hashes remain.
      function uploadFish(t, dt) {
        const swimSpan = Math.max(0.55, 0.5 * aspect * 1.35);
        const waterE = mouse.waterEnergy;
        const visibleFish = Math.round(FISH_COUNT * seaLifeDensity);

        for (let f = 0; f < FISH_COUNT; f++) {
          const fd = fish[f];
          if (f >= visibleFish) {
            gl.uniform4f(uFishALocs[f], 99.0, 99.0, 0.001, fd.dir);
            gl.uniform4f(uFishBLocs[f], 0.0, 0.0, 0.0, 0.0);
            continue;
          }
          if (fd.x === null) {
            fd.x = (Math.random() * 2.0 - 1.0) * swimSpan;
            fd.y = 0.5 - fd.laneY;
          }

          // Wave-coupled lane: fish near the surface ride the swell, deep ones barely move
          const depth = Math.max(0.0, 0.49 - fd.y);
          const wavePull = (estimateWaterSurfaceY(fd.x, t) - 0.496) * Math.exp(-depth * 4.2) * 0.55;
          const wander =
            Math.sin(t * fd.wanderSpeed + fd.wanderPhase) * 0.010 +
            Math.sin(t * fd.wanderSpeed * 0.41 + fd.phase) * 0.006;
          const targetY = 0.5 - fd.laneY + wander + wavePull;

          // Overdamped lane holding (no spring overshoot)
          fd.vy += (targetY - fd.y) * 0.9 * dt;
          fd.vy *= Math.exp(-dt * 2.4);

          // Heavy cursor displacement: fish are pushed aside, never launched
          if (waterE > 0.001) {
            const dx = fd.x - mouse.x;
            const dy = fd.y - mouse.y;
            const d2 = dx * dx + dy * dy;
            const near = Math.exp(-d2 * 24.0) * waterE;
            if (near > 0.001) {
              const inv = 1.0 / Math.sqrt(d2 + 1e-6);
              fd.vx += (dx * inv * near * 0.05 + mouse.velX * near * 0.04) * dt;
              fd.vy += (dy * inv * near * 0.08 + mouse.velY * near * 0.04) * dt;
            }
          }

          // Slowly rejoin the school heading
          fd.vx += (fd.dir * fd.speed - fd.vx) * (1.0 - Math.exp(-dt * 1.4));
          fd.x += fd.vx * dt;
          fd.y += fd.vy * dt;

          if (fd.x > swimSpan) fd.x -= swimSpan * 2.0;
          else if (fd.x < -swimSpan) fd.x += swimSpan * 2.0;
          if (fd.y < 0.040) fd.y = 0.040;
          else if (fd.y > 0.462) fd.y = 0.462;

          const pitch = Math.max(-0.45, Math.min(0.45, Math.atan2(fd.vy, Math.abs(fd.vx) + 0.008)));
          const flap = Math.sin(t * (6.4 + fd.speed * 40.0) + fd.phase) * 0.18;

          gl.uniform4f(uFishALocs[f], fd.x, fd.y, fd.size, fd.dir);
          gl.uniform4f(uFishBLocs[f], pitch, flap, fd.big, 0.0);
        }
      }

      // Seagulls: same treatment for the five birds in the upper half. The cursor
      // stirs the air and the flock slides away from it, then drifts back as the
      // air energy decays — a soft gust, never a bounce.
      function uploadGulls(t) {
        const gullSpan = 0.5 * aspect * 1.25;
        const airE = mouse.airEnergy;
        const visibleGulls = Math.round(GULL_COUNT * seaLifeDensity);
        for (let g = 0; g < GULL_COUNT; g++) {
          const fg = g;
          const gDir = fg % 2 < 1 ? 1.0 : -1.0;
          if (g >= visibleGulls) {
            gl.uniform4f(uGullALocs[g], 99.0, 0.8, 0.001, gDir);
            gl.uniform4f(uGullBLocs[g], 0.0, 0.0, 0.0, 0.0);
            continue;
          }
          const gSpeed = (0.045 + 0.030 * hash11(fg * 4.31)) * gDir;
          let gx = mod(t * gSpeed + hash11(fg * 6.17) * 4.0, gullSpan * 2.0) - gullSpan;
          let gy = 0.655 + 0.205 * hash11(fg * 8.53 + 2.0) + Math.sin(t * 0.43 + fg * 2.1) * 0.010;
          const W = 0.026 + 0.015 * hash11(fg * 3.97);
          const beat = 0.90 * Math.sin(t * (2.3 + 0.9 * hash11(fg * 1.7)) + fg * 1.4);

          if (airE > 0.001) {
            const dx = gx - mouse.x;
            const dy = gy - mouse.y;
            const d2 = dx * dx + dy * dy;
            const near = Math.exp(-d2 * 22.0) * airE;
            if (near > 0.001) {
              const inv = 1.0 / Math.sqrt(d2 + 1e-6);
              gx += dx * inv * near * 0.045 + mouse.velX * near * 0.008;
              gy += dy * inv * near * 0.030 + mouse.velY * near * 0.008;
            }
          }
          if (gy < 0.600) gy = 0.600;
          else if (gy > 0.940) gy = 0.940;

          gl.uniform4f(uGullALocs[g], gx, gy, W, gDir);
          gl.uniform4f(uGullBLocs[g], beat, 0.0, 0.0, 0.0);
        }
      }

      // =========================================================================
      // AUTO-RESIZE & GPU-BUDGETED DISPLAY ADAPTATION
      // =========================================================================
      let width = 1;
      let height = 1;
      let aspect = 1;

      // The pointillist shader is fill-rate heavy (several wave solves, sea life and
      // splash loops per pixel), so the framebuffer is scaled in two stages:
      //   baseScale — supersampling requested from the display's pixel ratio (2-3x)
      //   perfScale — adaptive, tuned to measured frame times below, but never below
      //                the point where baseScale * perfScale == 1 (native CSS pixels)
      // Absolute cap: a native 4K frame is ~8.3 MP, so nothing here is ever softer than
      // native — but a 2-3x supersampled 4K/5K frame (16-33 MP) can never be queued.
      const MAX_PIXELS = 12000000;

      function readBaseScale() {
        // Supersample again: this is what made the stipple crisp and fine-grained.
        return Math.min(Math.max(window.devicePixelRatio || 1, 2.0), 3.0);
      }

      let baseScale = readBaseScale();
      let perfScale = 1.0;

      // Lowest adaptive factor that still renders at native CSS resolution or better
      function minPerfScale() {
        return Math.min(1.0, 1.0 / Math.max(baseScale, 1.0));
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const cssW = rect.width || window.innerWidth;
        const cssH = rect.height || window.innerHeight;

        let scale = baseScale * perfScale;
        const pixelCount = cssW * cssH * scale * scale;
        if (pixelCount > MAX_PIXELS) {
          scale = Math.sqrt(MAX_PIXELS / Math.max(cssW * cssH, 1));
        }
        scale = Math.max(scale, Math.min(1.0, baseScale)); // never sub-native

        const displayW = Math.max(1, Math.round(cssW * scale));
        const displayH = Math.max(1, Math.round(cssH * scale));

        if (canvas.width !== displayW || canvas.height !== displayH) {
          canvas.width = displayW;
          canvas.height = displayH;
          width = displayW;
          height = displayH;
          aspect = width / height;
          gl.viewport(0, 0, width, height);
        }

        // Dot density tracks CSS height (~2.2 px per dot row), independent of render
        // scale: 1080p -> 491 rows, 1440p -> 655, 4K -> 1100 (clamped).
        gl.uniform1f(uDotDensityLoc, Math.min(Math.max(cssH / 2.2, 320.0), 1100.0));
      }

      window.addEventListener(
        'resize',
        function () {
          baseScale = readBaseScale(); // pixel ratio can change when moving between monitors
          resize();
        },
        { passive: true }
      );
      resize();

      // =========================================================================
      // LIVELY MOUSE SPLASH & AIR/WATER SEPARATED CONTROLLER
      // =========================================================================
      const NUM_SPLASHES = 16;
      const splashes = Array.from({ length: NUM_SPLASHES }, () => ({
        x: 0.0,
        y: 0.5,
        birthTime: -100.0,
        packedVelAndStrength: 0.0
      }));
      let nextSplashIdx = 0;
      let lastSplashSpawnTime = -10.0;

      let simTime = 0.0;
      let speedMultiplier = 1.0;

      const mouse = {
        targetX: 0.0,
        targetY: 0.5,
        x: 0.0,
        y: 0.5,
        velX: 0.0,
        velY: 0.0,
        waterEnergy: 0.0,
        targetWaterEnergy: 0.0,
        airEnergy: 0.0,
        targetAirEnergy: 0.0,
        initialized: false
      };

      // Approximate current water surface Y at aspectX so JS strictly separates water vs air
      function estimateWaterSurfaceY(aspectX, t) {
        const p1 = aspectX * 3.15 - t * 0.437;
        const c1 = Math.cos(p1);
        const ridge = Math.pow(Math.max(c1, 0.0), 7.0) * 0.042;
        const w1 = c1 * 0.068 + ridge;
        const w2 = Math.cos(aspectX * 5.60 - t * 0.646 + 4.7) * 0.018;
        const w3 = Math.cos(aspectX * 1.60 - t * 0.24 + 3.1) * 0.026;
        return 0.496 + w1 + w2 + w3;
      }

      function packSplashParams(velX, strength) {
        const vClamped = Math.max(-2.2, Math.min(2.2, velX));
        const vBucket = Math.max(0, Math.min(100, Math.round((vClamped / 2.2 + 1.0) * 50.0)));
        const sEncoded = Math.max(0.02, Math.min(0.95, strength * 0.5));
        return vBucket + sEncoded;
      }

      function spawnSplashAtSource(aspectX, uvY, velX, baseImpulse) {
        // Strictly spawn water splashes ONLY when the source is at or below the water surface
        if (splashStrength <= 0.001) return;
        const surfY = estimateWaterSurfaceY(aspectX, simTime);
        if (uvY > surfY + 0.012) return;

        const s = splashes[nextSplashIdx];
        s.x = aspectX;
        s.y = uvY;
        s.birthTime = simTime;
        const clampedImpulse = Math.max(0.08, Math.min(1.65, baseImpulse * splashStrength));
        s.packedVelAndStrength = packSplashParams(velX, clampedImpulse);
        nextSplashIdx = (nextSplashIdx + 1) % NUM_SPLASHES;
      }

      function onPointerActivity(clientX, clientY, isClick) {
        const normX = clientX / Math.max(window.innerWidth, 1);
        const normY = 1.0 - clientY / Math.max(window.innerHeight, 1);
        const aspectX = (normX - 0.5) * aspect;

        if (!mouse.initialized) {
          mouse.x = aspectX;
          mouse.y = normY;
          mouse.targetX = aspectX;
          mouse.targetY = normY;
          mouse.initialized = true;
        }

        const dx = aspectX - mouse.targetX;
        const dy = normY - mouse.targetY;
        const moveDist = Math.hypot(dx, dy);

        mouse.targetX = aspectX;
        mouse.targetY = normY;

        const surfY = estimateWaterSurfaceY(aspectX, simTime);
        const isInWater = normY <= surfY + 0.012;
        const moveIntensity = Math.min(moveDist * 28.0, 1.45);

        if (isInWater) {
          // Cursor is in or on the water: trigger splash right at (aspectX, normY)
          if (isClick) {
            mouse.targetWaterEnergy = Math.min(1.5, mouse.targetWaterEnergy + 1.05 * splashStrength);
            spawnSplashAtSource(aspectX, normY, dx * 26.0, 1.35);
            lastSplashSpawnTime = simTime;
          } else if (moveDist > 0.002) {
            mouse.targetWaterEnergy = Math.min(1.45, mouse.targetWaterEnergy + moveIntensity * 0.72 * splashStrength);
            if (simTime - lastSplashSpawnTime > 0.042) {
              lastSplashSpawnTime = simTime;
              const splashImpulse = 0.52 + moveIntensity * 0.78;
              spawnSplashAtSource(aspectX, normY, dx * 32.0, splashImpulse);
            }
          }
        } else {
          // Cursor is in the top 50% air: NOTHING happens to the water; only stir the air locally
          if (isClick || moveDist > 0.0015) {
            const airBoost = isClick ? 0.85 : moveIntensity * 0.65;
            mouse.targetAirEnergy = Math.min(1.25, mouse.targetAirEnergy + airBoost);
          }
        }
      }

      window.addEventListener(
        'pointermove',
        (e) => {
          onPointerActivity(e.clientX, e.clientY, false);
        },
        { passive: true }
      );

      window.addEventListener(
        'pointerdown',
        (e) => {
          onPointerActivity(e.clientX, e.clientY, true);
        },
        { passive: true }
      );

      window.livelyPropertyListener = function (name, val) {
        // Lively calls this once on load for each LivelyProperties control, then on change.
        const parsed = parseFloat(val);
        if (!Number.isFinite(parsed)) return;

        if (name === 'audioSensitivity') {
          audioSensitivity = Math.min(2.0, Math.max(0.0, parsed / 100.0));
        } else if (name === 'seaLifeDensity') {
          seaLifeDensity = Math.min(1.0, Math.max(0.0, parsed / 100.0));
        } else if (name === 'splashStrength') {
          splashStrength = Math.min(2.0, Math.max(0.0, parsed / 100.0));
        } else if (name === 'waveSpeed') {
          if (parsed > 0.0) speedMultiplier = parsed;
        }
      };

      // =========================================================================
      // RENDER LOOP — GPU-AWARE (112FPS+ READY)
      // =========================================================================
      let lastFrameMs = performance.now();
      let rafPending = false;
      let pageVisible = !document.hidden;

      // Frame-time telemetry. refreshMs is a low percentile of the recent intervals
      // (the display's vsync period), rawDtEMA a smoothed interval; the gap between
      // them is what tells us whether the GPU is keeping up.
      const dtWindow = [];
      let rawDtEMA = 1000 / 60;
      let refreshMs = 1000 / 60;
      let framesSinceTune = 0;
      let lastTuneMs = 0;

      function tuneGpuBudget(rawDt, nowMs) {
        // Throttled, stalled or resumed frames say nothing about GPU load
        if (!(rawDt > 1.0) || rawDt > 60.0) return;

        dtWindow.push(rawDt);
        if (dtWindow.length > 120) dtWindow.shift();
        rawDtEMA += (rawDt - rawDtEMA) * 0.07;

        framesSinceTune += 1;
        if (framesSinceTune < 45 || nowMs - lastTuneMs < 400) return;
        framesSinceTune = 0;
        lastTuneMs = nowMs;

        // ~5th percentile of recent intervals: robust estimate of the frame cadence.
        // Capped at 60Hz so a page the GPU has pushed down to 30fps is never mistaken
        // for an intentionally slow display (any real display is at least ~50Hz).
        const sorted = dtWindow.slice().sort(function (a, b) { return a - b; });
        refreshMs = Math.min(Math.max(sorted[Math.floor(sorted.length * 0.05)] || 1000 / 60, 1000 / 360), 1000 / 60);

        const budget = Math.max(refreshMs * 1.55, refreshMs + 3.0);
        const floor = minPerfScale();
        if (rawDtEMA > budget) {
          // GPU is falling behind: shrink the framebuffer, but never past native CSS
          // resolution — losing sharpness is the last thing we do, not the first.
          if (perfScale > floor + 0.01) {
            perfScale = Math.max(floor, perfScale * 0.88);
            resize();
          }
        } else if (rawDtEMA < budget * 0.8 && perfScale < 1.0) {
          // Comfortable headroom (20% below budget): grow back toward full
          // supersampling, so resolution is restored as soon as the GPU allows it.
          perfScale = Math.min(1.0, perfScale * 1.10);
          resize();
        }
      }

      function render(nowMs) {
        rafPending = false;
        const rawDt = nowMs - lastFrameMs;
        const dt = Math.min(rawDt * 0.001, 0.05);
        lastFrameMs = nowMs;
        if (pageVisible) tuneGpuBudget(rawDt, nowMs);
        simTime += dt * speedMultiplier;

        const follow = 1.0 - Math.exp(-dt * 14.0);
        const prevX = mouse.x;
        const prevY = mouse.y;
        mouse.x += (mouse.targetX - mouse.x) * follow;
        mouse.y += (mouse.targetY - mouse.y) * follow;

        const instVx = dt > 0.0001 ? (mouse.x - prevX) / dt : 0.0;
        const instVy = dt > 0.0001 ? (mouse.y - prevY) / dt : 0.0;
        mouse.velX = mouse.velX * Math.exp(-dt * 7.0) + Math.max(-2.5, Math.min(2.5, instVx)) * 0.32;
        mouse.velY = mouse.velY * Math.exp(-dt * 7.0) + Math.max(-2.5, Math.min(2.5, instVy)) * 0.32;

        mouse.targetWaterEnergy *= Math.exp(-dt * 3.2);
        mouse.waterEnergy += (mouse.targetWaterEnergy - mouse.waterEnergy) * (1.0 - Math.exp(-dt * 8.5));

        mouse.targetAirEnergy *= Math.exp(-dt * 3.8);
        mouse.airEnergy += (mouse.targetAirEnergy - mouse.airEnergy) * (1.0 - Math.exp(-dt * 9.0));

        updateAudio(dt);

        gl.uniform2f(uResolutionLoc, width, height);
        gl.uniform1f(uTimeLoc, simTime);
        gl.uniform4f(uMouseLoc, mouse.x, mouse.y, mouse.velX, mouse.velY);
        gl.uniform2f(uMouseEnergyLoc, mouse.waterEnergy, mouse.airEnergy);
        gl.uniform4f(uAudioLoc, audio.bass, audio.mid, audio.treble, audio.level);
        gl.uniform1f(uBeatLoc, audio.beat);

        // Retire expired splash records so uActiveSplashes drops to 0 when the water
        // is left alone — that is what lets the shader skip its splash loops.
        let activeSplashes = 0;
        for (let i = 0; i < NUM_SPLASHES; i++) {
          const s = splashes[i];
          const alive = s.packedVelAndStrength !== 0 && simTime - s.birthTime <= 4.4;
          if (s.packedVelAndStrength !== 0 && !alive) s.packedVelAndStrength = 0;
          if (alive) activeSplashes += 1;
          gl.uniform4f(uSplashLocs[i], s.x, s.y, s.birthTime, s.packedVelAndStrength);
        }
        gl.uniform1f(uActiveSplashesLoc, activeSplashes);

        // CPU-side per-frame entity state: pure math, once per frame
        uploadBubbles(simTime);
        uploadFish(simTime, dt);
        uploadGulls(simTime);
        updateJellies(simTime, dt);

        gl.drawArrays(gl.TRIANGLES, 0, 3);

        scheduleFrame();
      }

      function scheduleFrame() {
        if (pageVisible && !rafPending) {
          rafPending = true;
          requestAnimationFrame(render);
        }
      }

      // Stop burning GPU while the host hides the wallpaper (Lively pauses the page,
      // or another window covers it) and reset the timing window on return so the
      // hidden stretch is never mistaken for a slow frame.
      document.addEventListener('visibilitychange', function () {
        pageVisible = !document.hidden;
        if (pageVisible) {
          lastFrameMs = performance.now();
          dtWindow.length = 0;
          rawDtEMA = 1000 / 60;
          scheduleFrame();
        }
      });

      // Draw the first frame immediately so the wallpaper is complete even before
      // the first animation frame is delivered, then continue on rAF.
      window.__dbg = {
        gl, audio, mouse,
        get width(){ return width; },
        get height(){ return height; },
        get lastFrameMs(){ return lastFrameMs; },
        get perfScale(){ return perfScale; },
        set perfScale(v){ perfScale = v; resize(); },
        render
      };
      render(performance.now());
    })();
  </script>

  <script>
    (function () {
      'use strict';

      const clockCanvas = document.getElementById('clock-canvas');
      const ctx = clockCanvas.getContext('2d');
      if (!ctx) return;

      // Compact 5×7 dot-matrix alphabet for the clock
      const GLYPHS = {
        '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'],
        '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
        '2': ['01110', '10001', '00001', '00010', '00100', '01000', '11111'],
        '3': ['11111', '00010', '00100', '00010', '00001', '10001', '01110'],
        '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'],
        '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
        '6': ['00110', '01000', '10000', '11110', '10001', '10001', '01110'],
        '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
        '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
        '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'],
        ':': ['00000', '00000', '00100', '00000', '00100', '00000', '00000']
      };

      function hash(a, b, c) {
        const n = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453;
        return n - Math.floor(n);
      }

      // ---------------------------------------------------------------------
      // Viscous pointer interaction: clock beads shy away from the cursor,
      // swell and brighten, then settle heavily back into place.
      // ---------------------------------------------------------------------
      const ptr = { x: -1e5, y: -1e5, has: false, targetEnergy: 0 };
      let clockEnergy = 0;
      let smoothX = -1e5;
      let smoothY = -1e5;
      let wasActive = false;
      let lastFrameMs = performance.now();
      let lastRenderedText = '';

      function currentTimeText() {
        const now = new Date();
        return (
          String(now.getHours()).padStart(2, '0') +
          ':' +
          String(now.getMinutes()).padStart(2, '0')
        );
      }

      function renderClock(timeText) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1.25), 2.5);
        const pixelW = Math.round(w * dpr);
        const pixelH = Math.round(h * dpr);

        if (clockCanvas.width !== pixelW || clockCanvas.height !== pixelH) {
          clockCanvas.width = pixelW;
          clockCanvas.height = pixelH;
        }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const minDim = Math.min(w, h);
        const cell = Math.max(7, Math.min(34, minDim * 0.019, w * 0.03));
        const glyphW = 5;
        const glyphH = 7;
        const gap = 1;
        const totalCells = glyphW * timeText.length + gap * (timeText.length - 1);
        const clockW = totalCells * cell;
        const clockH = glyphH * cell;
        const startX = (w - clockW) * 0.5;
        const startY = h * 0.265 - clockH * 0.5;

        // Build every lit bead once, applying the cursor's viscous push
        const sigma = Math.max(52, cell * 3.4);
        const sigma2 = 2 * sigma * sigma;
        const beads = [];
        for (let gi = 0; gi < timeText.length; gi++) {
          const rows = GLYPHS[timeText[gi]];
          if (!rows) continue;
          const glyphX = startX + gi * (glyphW + gap) * cell;

          for (let row = 0; row < glyphH; row++) {
            for (let col = 0; col < glyphW; col++) {
              if (rows[row][col] !== '1') continue;
              const r = hash(gi + 1, row + 1, col + 1);
              const r2 = hash(gi + 3, row + 7, col + 2);
              let x = glyphX + (col + 0.5 + (r - 0.5) * 0.10) * cell;
              let y = startY + (row + 0.5 + (r2 - 0.5) * 0.10) * cell;
              let boost = 0;

              if (clockEnergy > 0.0025 && ptr.has) {
                const dx = x - smoothX;
                const dy = y - smoothY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const infl = Math.exp(-(dist * dist) / sigma2) * clockEnergy;
                if (infl > 0.004) {
                  const push = Math.min(infl * cell * 1.6, cell * 0.72);
                  if (dist > 0.5) {
                    x += (dx / dist) * push;
                    y += (dy / dist) * push;
                  }
                  boost = infl;
                }
              }

              beads.push({
                x: x,
                y: y,
                r: r,
                boost: boost,
                light: hash(gi + 9, row + 4, col + 8)
              });
            }
          }
        }

        ctx.globalCompositeOperation = 'lighter';

        // Pass 1: soft cyan aura made of the same beads, barely there
        for (let i = 0; i < beads.length; i++) {
          const b = beads[i];
          const radius = cell * (0.24 + 0.08 * b.r) * (1 + 0.5 * b.boost);

          ctx.beginPath();
          ctx.arc(b.x, b.y, radius * 2.6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(70, 200, 235, ' + (0.028 + 0.05 * b.boost).toFixed(4) + ')';
          ctx.fill();
        }

        // Pass 2: crisp pointillist pigment beads with icy highlights
        for (let i = 0; i < beads.length; i++) {
          const b = beads[i];
          const radius = cell * (0.235 + 0.075 * b.r) * (1 + 0.42 * b.boost);
          const hue = 188 + (b.r - 0.5) * 12;
          const lightness = Math.min(94, 70 + 16 * b.light + 15 * b.boost);
          const alpha = Math.min(1, 0.78 + 0.20 * b.r + 0.30 * b.boost);

          ctx.beginPath();
          ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
          ctx.fillStyle =
            'hsla(' + hue.toFixed(1) + ', 96%, ' + lightness.toFixed(1) + '%, ' + alpha.toFixed(3) + ')';
          ctx.fill();

          // Small convex glint so every bead reads as a liquid-glass pearl
          if (radius > 1.4) {
            ctx.beginPath();
            ctx.arc(b.x - radius * 0.28, b.y - radius * 0.30, radius * 0.34, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(240, 253, 255, 0.68)';
            ctx.fill();
          }
        }

        ctx.globalCompositeOperation = 'source-over';
      }

      // Pointer drives the beads: energy builds while you move, then decays
      window.addEventListener(
        'pointermove',
        function (e) {
          const dx = e.clientX - ptr.x;
          const dy = e.clientY - ptr.y;
          const moved = ptr.has ? Math.sqrt(dx * dx + dy * dy) : 0;
          if (!ptr.has) {
            smoothX = e.clientX;
            smoothY = e.clientY;
            ptr.has = true;
          }
          ptr.x = e.clientX;
          ptr.y = e.clientY;
          if (moved > 0.001) {
            ptr.targetEnergy = Math.min(1.6, ptr.targetEnergy + Math.min(moved * 0.045, 0.8));
          }
        },
        { passive: true }
      );

      window.addEventListener(
        'pointerdown',
        function (e) {
          if (!ptr.has) {
            smoothX = e.clientX;
            smoothY = e.clientY;
            ptr.has = true;
          }
          ptr.x = e.clientX;
          ptr.y = e.clientY;
          ptr.targetEnergy = Math.min(1.7, ptr.targetEnergy + 1.05);
        },
        { passive: true }
      );

      function clockFrame(nowMs) {
        const dt = Math.min((nowMs - lastFrameMs) * 0.001, 0.05);
        lastFrameMs = nowMs;

        ptr.targetEnergy *= Math.exp(-dt * 2.8);
        clockEnergy += (ptr.targetEnergy - clockEnergy) * (1 - Math.exp(-dt * 7.5));

        const follow = 1 - Math.exp(-dt * 6.5);
        smoothX += (ptr.x - smoothX) * follow;
        smoothY += (ptr.y - smoothY) * follow;

        const text = currentTimeText();
        const active = clockEnergy > 0.0025;
        if (text !== lastRenderedText || active || (wasActive && !active)) {
          lastRenderedText = text;
          renderClock(text);
        }
        wasActive = active;
      }

      window.addEventListener(
        'resize',
        function () {
          renderClock(currentTimeText());
        },
        { passive: true }
      );
      window.addEventListener(
        'orientationchange',
        function () {
          renderClock(currentTimeText());
        },
        { passive: true }
      );
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) renderClock(currentTimeText());
      });

      // Draw immediately, then tick on a timer: the clock stays correct even when
      // a host throttles requestAnimationFrame (idle webviews, locked screens).
      lastRenderedText = currentTimeText();
      renderClock(lastRenderedText);
      window.setInterval(function () {
        clockFrame(performance.now());
      }, 33);
    })();
  </script>
</body>
